<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <style>
    :root { --ink: #203933; --muted: #61756d; --cream: #fffdf7; --sage: #d8e8d3; --mint: #eff7ed; --forest: #1f5a4e; --coral: #ec8069; --amber: #fff6db; --line: #d9dfd3; }
    * { box-sizing: border-box; }
    body { max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem 4rem; color: var(--ink); background: var(--cream); font-family: Arial, sans-serif; font-size: 16px; line-height: 1.55; }
    h1, h2, h3 { font-family: Georgia, serif; line-height: 1.12; }
    h1 { max-width: 680px; margin: 0; font-size: clamp(2.8rem, 8vw, 4.8rem); letter-spacing: -.05em; }
    h2 { margin: 0; font-size: 1.7rem; }
    h3 { margin: .1rem 0 .4rem; font-size: 1.08rem; }
    a { color: var(--forest); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .eyebrow { margin: 0 0 .6rem; color: var(--forest); font-size: .78rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .lede { max-width: 680px; margin: 1.2rem 0 1.8rem; color: var(--muted); font-size: 1.12rem; }
    .notice { padding: 1rem 1.1rem; margin: 1.5rem 0 2rem; background: var(--amber); border-left: 5px solid var(--coral); border-radius: 0 10px 10px 0; }
    .print-button { display: inline-block; padding: .65rem 1rem; color: #fff; background: var(--forest); border-radius: 8px; font-weight: 700; text-decoration: none; }
    .quick-links { display: flex; flex-wrap: wrap; gap: .9rem; margin: 1.5rem 0 2.4rem; }
    .supplies { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin: 1rem 0 2rem; }
    .supply { padding: .9rem; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    .supply p { margin: 0; color: var(--muted); font-size: .9rem; }
    .step { display: grid; grid-template-columns: 44px 1fr; gap: 1rem; padding: 1.5rem 0; border-top: 1px solid var(--line); }
    .step-number { display: grid; place-items: center; width: 36px; height: 36px; color: #fff; background: var(--forest); border-radius: 50%; font-weight: 700; }
    .step p { margin: .55rem 0; }
    .method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: .8rem; }
    .method { padding: 1rem; background: var(--mint); border-radius: 10px; }
    .method p, .method ul { font-size: .93rem; }
    ul { padding-left: 1.25rem; }
    li + li { margin-top: .35rem; }
    .code { display: inline-block; padding: .05rem .3rem; background: #e7eee4; border-radius: 3px; font-family: monospace; }
    .important { padding: .8rem 1rem; margin-top: .9rem; background: #fff8e8; border-radius: 8px; }
    footer { padding-top: 1.5rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }
    @media (max-width: 650px) { body { padding: 2rem 1rem; }.supplies, .method-grid { grid-template-columns: 1fr; } }
    @media print { @page { margin: 12mm; } body { max-width: none; padding: 0; background: #fff; font-size: 10pt; } h1 { font-size: 30pt; } h2 { font-size: 16pt; }.quick-links { display: none; }.notice { break-inside: avoid; }.preparation { break-after: page; }.supplies { grid-template-columns: repeat(3, 1fr); }.step { break-inside: avoid; padding: .7rem 0; }.method { background: #f2f2f2; }.step-number { color: #000; background: #fff; border: 1px solid #000; } }
  </style>
</head>
<body>
{{body}}
</body>
</html>
