name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned test reference
        run: python -m pip install --require-hashes -r offline-package/test-requirements.txt

      - name: Verify guide builds and offline derivation
        run: python offline-package/verify.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          mkdir -p _site/en _site/de
          cp -R dist/en/. _site/en/
          cp -R dist/de/. _site/de/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
