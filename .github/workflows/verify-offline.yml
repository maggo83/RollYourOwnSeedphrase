name: Verify offline edition

on:
  pull_request:
  push:
    branches: [main, offline-package]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned test reference
        run: python -m pip install --require-hashes -r offline-package/test-requirements.txt

      - name: Verify deterministic builds and offline derivation
        run: python offline-package/verify.py
