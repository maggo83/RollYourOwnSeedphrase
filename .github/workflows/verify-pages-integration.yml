name: Verify Pages integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned test reference
        run: python -m pip install --require-hashes -r offline-package/test-requirements.txt

      - name: Install pinned print dependency
        run: python -m pip install --require-hashes -r print-requirements.txt

      - name: Verify guide builds and offline derivation
        run: python offline-package/verify.py

      - name: Assemble Pages site
        run: |
          mkdir -p _site/en _site/de
          cp dist/index.html _site/index.html
          cp -R dist/en/. _site/en/
          cp -R dist/de/. _site/de/
          test -f _site/index.html
          test -f _site/en/index.html
          test -f _site/de/index.html
          test ! -d _site/de/de
          grep -F 'href="en/index.html"' _site/index.html
          grep -F 'href="de/index.html"' _site/index.html