<!doctype html>
<html lang="{{attr-01}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <meta name="description" content="{{attr-02}}">
  <title>{{text-01}}</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand" aria-label="{{attr-03}}">
      <span class="brand-mark" aria-hidden="true">{{text-02}}</span>
      <span>{{text-03}}<br><strong>{{text-04}}</strong></span>
    </div>
    <a class="plain-guide-link" href="{{attr-04}}">{{text-05}}</a>
  </header>

  <main>
    <section class="hero intro" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">{{text-06}}</p>
        <h1 id="hero-title">{{text-07}}<br>{{text-08}}</h1>
        <p class="hero-text">{{text-09}}</p>
        <p class="hero-safety-note"><strong>{{text-10}}</strong>{{text-11}}<strong>{{text-12}}</strong>{{text-13}}</p>
        <div class="hero-actions">
          <button class="button button-primary start-guide" type="button">{{text-14}}<span aria-hidden="true">→</span></button>
        </div>
      </div>
      <div class="hero-art" aria-label="{{attr-05}}">
        <div class="spark spark-one">✦</div><div class="spark spark-two">✦</div>
        <div class="box-lid"><span></span><span></span><span></span></div>
        <div class="box">
          <span class="die die-a">{{text-02}}</span><span class="die die-b">⚂</span><span class="die die-c">⚀</span>
        </div>
        <p class="art-caption">{{text-15}}</p>
      </div>
    </section>

    <section class="wizard" aria-label="{{attr-06}}">
      <div class="wizard-progress" aria-live="polite"><span class="progress-label">{{text-16}}<strong data-current-step>1</strong>{{text-17}}</span><div class="progress-track"><span></span></div><span data-progress-title>{{text-18}}</span></div>
      <div class="step-stage">
